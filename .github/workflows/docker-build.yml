name: Docker Build and Validation

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  workflow_dispatch:

jobs:
  build-base:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build td_base
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.td_base
          push: false
          tags: td_base:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-ml:
    runs-on: ubuntu-latest
    needs: build-base
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build td_base first
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.td_base
          push: false
          tags: td_base:latest
          load: true

      - name: Build td_base_nvidia_ml
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.td_base_nvidia_ml
          push: false
          tags: td_base_nvidia_ml:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-hpc:
    runs-on: ubuntu-latest
    needs: build-base
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build td_base_hpc
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.td_base_hpc
          push: false
          tags: td_base_hpc:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

  lint-shell-scripts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@v2
        with:
          scandir: './scripts'
          ignore_paths: 'node_modules .git'
          severity: warning

  markdown-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Markdown Lint
        uses: DavidAnson/markdownlint-cli2-action@v18
        with:
          globs: '**/*.md'
